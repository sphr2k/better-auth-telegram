name: Public package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-package
          path: release
      - name: Publish public package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          version=$(tar -xOzf ./*.tgz package/package.json | jq -r .version)
          test "$RELEASE_TAG" = "v$version"
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS \
            --title "$RELEASE_TAG" \
            --notes "Built public package for Better Auth 1.7. Install the versioned .tgz URL directly with Bun; no registry credentials are required."
